# Overlay for the handbook build on qtdmm.de (@RP@ is filled in by build.sh).
# Inherits the project's mkdocs.yml
# and only changes what the website needs: no CDN resources (privacy page
# promises none), a canonical URL, and an Edit link.
INHERIT: @RP@/mkdocs.yml
docs_dir: @RP@/docs
site_url: https://www.qtdmm.de/docs/
theme:
  name: mkdocs
  highlightjs: false
